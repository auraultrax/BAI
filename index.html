<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAI — Aura X</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background: radial-gradient(circle at top, #1a0b2e 0%, #090314 100%); color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 16px; }
    .aura-container { width: 100%; max-width: 850px; height: 90vh; background: rgba(18, 10, 35, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(168, 85, 247, 0.15); }
    .aura-header { padding: 20px 24px; background: rgba(26, 15, 48, 0.8); border-bottom: 1px solid rgba(168, 85, 247, 0.2); display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .ai-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #a855f7, #3b82f6); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-weight: 600; color: white; box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }
    .brand h1 { font-size: 1.25rem; font-weight: 600; background: linear-gradient(to right, #e879f9, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .status-pill { font-size: 0.75rem; padding: 6px 12px; border-radius: 20px; background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.3); color: #d8b4fe; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 6px; height: 6px; background: #a855f7; border-radius: 50%; box-shadow: 0 0 8px #a855f7; }
    .chat-stream { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .message { max-width: 75%; padding: 14px 18px; border-radius: 14px; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .user-msg { align-self: flex-end; background: linear-gradient(135deg, #9333ea, #4f46e5); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3); }
    .ai-msg { align-self: flex-start; background: rgba(30, 20, 56, 0.6); border: 1px solid rgba(168, 85, 247, 0.15); color: #f3e8ff; border-bottom-left-radius: 4px; }
    .input-dock { padding: 20px 24px; background: rgba(15, 8, 30, 0.9); border-top: 1px solid rgba(168, 85, 247, 0.2); display: flex; gap: 12px; }
    textarea { flex: 1; background: rgba(26, 15, 48, 0.6); border: 1px solid rgba(168, 85, 247, 0.25); border-radius: 12px; padding: 14px; color: #fff; resize: none; height: 52px; outline: none; font-size: 0.95rem; }
    textarea:focus { border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); }
    .send-btn { background: linear-gradient(135deg, #a855f7, #6366f1); color: white; border: none; padding: 0 24px; border-radius: 12px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); }
    .send-btn:disabled { background: #33244d; color: #7c6f93; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="aura-container">
  <div class="aura-header">
    <div class="brand">
      <div class="ai-avatar">BAI</div>
      <h1>BAI — Aura X</h1>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span id="statusText">Güvenli Mod</span>
    </div>
  </div>
  
  <div class="chat-stream" id="chatStream">
    <div class="message ai-msg">Selam! Ben BAI. Supabase Secret üzerinden güvenle bağlıyım.</div>
  </div>
  
  <div class="input-dock">
    <textarea id="userInput" placeholder="Bir şeyler yazın..."></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendToBAI()">Gönder</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://bjzgbqazezjboskcaqrh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_u9ctUFj6Hu9qBrXShO5jaw__Pw-aGux';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendToBAI();
    }
  });

  async function sendToBAI() {
    const inputField = document.getElementById('userInput');
    const chatStream = document.getElementById('chatStream');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');
    
    const prompt = inputField.value.trim();
    if (!prompt) return;

    appendMsg(prompt, 'user-msg');
    inputField.value = '';
    sendBtn.disabled = true;
    statusText.textContent = 'BAI düşünüyor...';

    const aiBubble = appendMsg('', 'ai-msg');

    try {
      // Doğrudan tünel yerine Supabase Edge Function çağrılır (Secret arka planda çalışır)
      const { data, error } = await supabase.functions.invoke('chat', {
        body: { prompt: prompt }
      });

      if (error) throw error;

      aiBubble.textContent = data.response;
      statusText.textContent = 'Güvenli Mod';

    } catch (err) {
      aiBubble.textContent = 'Hata: ' + (err.message || 'Bağlantı kurulamadı.');
      statusText.textContent = 'Hata';
    } finally {
      sendBtn.disabled = false;
      inputField.focus();
      chatStream.scrollTop = chatStream.scrollHeight;
    }
  }

  function appendMsg(text, className) {
    const chatStream = document.getElementById('chatStream');
    const div = document.createElement('div');
    div.className = `message ${className}`;
    div.textContent = text;
    chatStream.appendChild(div);
    chatStream.scrollTop = chatStream.scrollHeight;
    return div;
  }
</script>

</body>
</html>
