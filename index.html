<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama & Supabase Streaming Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; padding: 20px; }
    
    .chat-container { width: 100%; max-width: 800px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .chat-header { padding: 16px 24px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h2 { font-size: 1.1rem; font-weight: 600; color: #38bdf8; }
    .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: #334155; color: #94a3b8; }
    
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .user-message { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: 2px; }
    .ai-message { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
    
    .input-area { padding: 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 10px; }
    textarea { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #fff; resize: none; height: 50px; outline: none; }
    textarea:focus { border-color: #38bdf8; }
    button { background: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>Cloudflare Tunnel + Ollama AI</h2>
    <span id="statusBadge" class="status-badge">Hazır</span>
  </div>
  
  <div class="chat-box" id="chatBox">
    <div class="message ai-message">Merhaba! Tünel bağlantısı hazır. Sorunu yazabilirsin.</div>
  </div>
  
  <div class="input-area">
    <textarea id="userInput" placeholder="Mesajınızı yazın... (Göndermek için Enter'a basın)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Gönder</button>
  </div>
</div>

<script>
  // Supabase İstemcisi
  const SUPABASE_URL = 'https://bjzgbqazezjboskcaqrh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_u9ctUFj6Hu9qBrXShO5jaw__Pw-aGux';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Cloudflare Tunnel URL'si (Verdiğin tünel adresine göre ayarlandı)
  const OLLAMA_TUNNEL_URL = 'https://levels-insulation-temporal-holdem.trycloudflare.com/api/generate';

  document.getElementById('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function sendMessage() {
    const inputField = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const sendBtn = document.getElementById('sendBtn');
    const statusBadge = document.getElementById('statusBadge');
    
    const prompt = inputField.value.trim();
    if (!prompt) return;

    appendMessage(prompt, 'user-message');
    inputField.value = '';
    sendBtn.disabled = true;
    statusBadge.textContent = 'Yazıyor...';

    const aiMessageDiv = appendMessage('', 'ai-message');
    let fullResponse = '';

    try {
      const response = await fetch(OLLAMA_TUNNEL_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'llama3',
          prompt: prompt,
          stream: true
        })
      });

      if (!response.ok) throw new Error('Cloudflare Tüneline erişilemedi. Terminalde tünelin açık olduğundan emin ol.');

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n').filter(line => line.trim() !== '');

        for (const line of lines) {
          try {
            const parsed = JSON.parse(line);
            if (parsed.response) {
              fullResponse += parsed.response;
              aiMessageDiv.textContent = fullResponse;
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          } catch (e) {
            console.error('Parçalama hatası:', e);
          }
        }
      }

      statusBadge.textContent = "Supabase'e kaydediliyor...";

      // Supabase veritabanına kayıt
      const { error } = await supabase
        .from('ai_logs')
        .insert([{ prompt: prompt, response: fullResponse }]);

      if (error) {
        console.error('Supabase Kayıt Hatası:', error.message);
        statusBadge.textContent = 'Kayıt Hatası';
      } else {
        statusBadge.textContent = 'Hazır';
      }

    } catch (err) {
      aiMessageDiv.textContent = 'Hata: ' + err.message;
      statusBadge.textContent = 'Bağlantı Hatası';
    } finally {
      sendBtn.disabled = false;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  }

  function appendMessage(text, className) {
    const chatBox = document.getElementById('chatBox');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${className}`;
    messageDiv.textContent = text;
    chatBox.appendChild(messageDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    return messageDiv;
  }
</script>

</body>
</html>
